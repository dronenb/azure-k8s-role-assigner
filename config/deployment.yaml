apiVersion: v1
kind: Namespace
metadata:
  name: azure-k8s-role-assigner
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-k8s-role-assigner
  namespace: azure-k8s-role-assigner
  annotations:
    # Used by Azure Workload Identity webhook to inject AZURE_CLIENT_ID
    # If the webhook is not installed, manually set AZURE_CLIENT_ID in the deployment env vars below
    azure.workload.identity/client-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-k8s-role-assigner
rules:
  # Read-only access to watch and inspect bindings — safe, no privilege escalation risk.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azure-k8s-role-assigner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azure-k8s-role-assigner
subjects:
  - kind: ServiceAccount
    name: azure-k8s-role-assigner
    namespace: azure-k8s-role-assigner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: azure-k8s-role-assigner-leader-election
  namespace: azure-k8s-role-assigner
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: azure-k8s-role-assigner-leader-election
  namespace: azure-k8s-role-assigner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: azure-k8s-role-assigner-leader-election
subjects:
  - kind: ServiceAccount
    name: azure-k8s-role-assigner
    namespace: azure-k8s-role-assigner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-k8s-role-assigner
  namespace: azure-k8s-role-assigner
  labels:
    app: azure-k8s-role-assigner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azure-k8s-role-assigner
  template:
    metadata:
      labels:
        app: azure-k8s-role-assigner
        # Tells Azure Workload Identity webhook to inject env vars and tokens
        # If webhook is not installed, this label has no effect (can be removed)
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: azure-k8s-role-assigner
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/dronenb/azure-k8s-role-assigner:latest
          imagePullPolicy: Always
          command:
            - /ko-app/cmd
          args:
            - --leader-elect
          env:
            # Comma-separated list of Service Principal Object IDs for cluster authentication
            - name: AZURE_SERVICE_PRINCIPALS
              value: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx,yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
            # Azure Tenant ID
            - name: AZURE_TENANT_ID
              value: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

            # ===== AUTHENTICATION CONFIGURATION =====
            # Option 1: Azure Workload Identity with webhook (Recommended for AKS)
            #   - AZURE_CLIENT_ID is auto-injected by webhook from ServiceAccount annotation
            #   - Keep AZURE_FEDERATED_TOKEN_FILE set below
            #   - No AZURE_CLIENT_SECRET needed
            #
            # Option 2: Manual Workload Identity (No webhook, but federated credentials configured)
            #   - Uncomment AZURE_CLIENT_ID below and set manually
            #   - Keep AZURE_FEDERATED_TOKEN_FILE set below
            #   - No AZURE_CLIENT_SECRET needed
            #
            # Option 3: Client Secret Authentication (Not recommended)
            #   - Uncomment AZURE_CLIENT_ID below and set manually
            #   - Uncomment AZURE_CLIENT_SECRET below and set manually
            #   - Remove or comment out AZURE_FEDERATED_TOKEN_FILE
            #
            # Option 4: Managed Identity (Azure VMs/VMSS)
            #   - Uncomment AZURE_CLIENT_ID below (only for user-assigned identity)
            #   - Remove or comment out AZURE_FEDERATED_TOKEN_FILE
            #   - No AZURE_CLIENT_SECRET needed

            # Uncomment if webhook is not available OR not using Workload Identity:
            # - name: AZURE_CLIENT_ID
            #   value: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

            # Uncomment ONLY for client secret authentication:
            # - name: AZURE_CLIENT_SECRET
            #   value: "your-client-secret"

            # For Workload Identity (with or without webhook) - comment out for client secret or managed identity:
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            - name: AZURE_AUTHORITY_HOST
              value: "https://login.microsoftonline.com/"
            # Uncomment for production to disable Azure CLI/Azure Dev CLI/Azure PowerShell authentication:
            - name: AZURE_TOKEN_CREDENTIALS
              value: "prod"
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /tmp
              name: tmp
              readOnly: false
            - mountPath: /var/run/secrets/azure/tokens
              name: azure-identity-token
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: azure-identity-token
                  expirationSeconds: 3600
                  audience: api://AzureADTokenExchange
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: azure-k8s-role-assigner-metrics
  namespace: azure-k8s-role-assigner
  labels:
    app: azure-k8s-role-assigner
spec:
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
  selector:
    app: azure-k8s-role-assigner
