ENABLE_LINTERS:
  # Disabled until actionlint supports ubuntu-26.04:
  # https://github.com/rhysd/actionlint/pull/683
  # - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - MARKDOWN_MARKDOWNLINT
  - JAVASCRIPT_PRETTIER
  - YAML_PRETTIER
  - SPELL_VALE
  - DOCKERFILE_HADOLINT
  - REPOSITORY_BETTERLEAKS
  - REPOSITORY_GIT_DIFF
  - KUBERNETES_HELM
  - TERRAFORM_TFLINT
  - TERRAFORM_TERRAFORM_FMT
  - POWERSHELL_POWERSHELL_FORMATTER
  - GO_REVIVE

FLAVOR_SUGGESTIONS: false
SARIF_REPORTER: true
SECURITY_SUGGESTIONS: false
# CI lints a clean checkout, so this only affects local runs. Without it
# betterleaks flags real credentials in gitignored files such as
# e2e/tofu/terraform.tfstate.backup and .e2e/sa-signing.key.
IGNORE_GITIGNORED_FILES: true

ADDITIONAL_EXCLUDED_DIRECTORIES:
  - .opencode
  - bin
  - megalinter-reports
  - vendor

MARKDOWN_MARKDOWNLINT_FILE_EXTENSIONS:
  - .md

JAVASCRIPT_PRETTIER_FILE_EXTENSIONS:
  - .js
  - .json
  - .md

YAML_PRETTIER_FILE_EXTENSIONS:
  - .yml
  - .yaml

SPELL_VALE_FILE_EXTENSIONS:
  - .md

DOCKERFILE_HADOLINT_FILE_NAMES_REGEX:
  - Containerfile
  - (.*\.)?Dockerfile

KUBERNETES_HELM_ARGUMENTS: charts/azure-k8s-role-assigner
KUBERNETES_DIRECTORY: charts/azure-k8s-role-assigner

TERRAFORM_TFLINT_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# MegaLinter v10.1.0 ships zizmor 1.25.0, which cannot even parse the
# self-repository `uses: $/...` syntax the workflows use: it fails with
# "data did not match any variant of untagged enum Job" and audits nothing.
# Run a newer zizmor from PyPI via uvx (bundled in the image) instead. The
# version is pinned and tracked by Renovate; bare `uvx zizmor` would silently
# float to whatever is newest.
ACTION_ZIZMOR_CLI_EXECUTABLE:
  - uvx
  - zizmor@1.31.1

ACTION_ZIZMOR_ARGUMENTS: >-
  --persona=pedantic
  --min-severity informational
  --min-confidence low
  --strict-collection
