{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "azure-k8s-role-assigner.fullname" . }}
  namespace: {{ include "azure-k8s-role-assigner.namespace" . }}
  labels:
    {{- include "azure-k8s-role-assigner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "azure-k8s-role-assigner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.ingress.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: metrics
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
