apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "azure-k8s-role-assigner.fullname" . }}
  namespace: {{ include "azure-k8s-role-assigner.namespace" . }}
  labels:
    {{- include "azure-k8s-role-assigner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
