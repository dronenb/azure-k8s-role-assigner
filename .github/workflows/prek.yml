name: prek

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write # MegaLinter PR comments and setup-comment cleanup.
      pull-requests: write # MegaLinter pull request reporter.
      security-events: write # MegaLinter SARIF upload to code scanning.
      statuses: write # MegaLinter GitHub status reporter.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load MegaLinter image config
        id: megalinter-image
        run: |
          set -euo pipefail
          source .github/megalinter-image.env
          {
            echo "MEGALINTER_IMAGE=${MEGALINTER_IMAGE}"
            echo "MEGALINTER_IMAGE_CACHE_DIGEST=${MEGALINTER_IMAGE_CACHE_DIGEST}"
            echo "MEGALINTER_IMAGE_DIGEST=${MEGALINTER_IMAGE_DIGEST}"
            echo "MEGALINTER_RUNNER_VERSION=${MEGALINTER_RUNNER_VERSION}"
            echo "MEGALINTER_VERSION=${MEGALINTER_VERSION}"
          } >> "${GITHUB_ENV}"
          {
            echo "cache-digest=${MEGALINTER_IMAGE_CACHE_DIGEST}"
            echo "image=${MEGALINTER_IMAGE}"
            echo "version=${MEGALINTER_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install prek
        if: github.event_name != 'push'
        uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
        with:
          cache: false
          install-only: true

      - name: Restore Podman image cache
        id: cache-podman-images
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.local/share/containers
          key: podman-megalinter-${{ steps.megalinter-image.outputs.version }}-${{ steps.megalinter-image.outputs.cache-digest }}-${{ runner.os }}-${{ runner.arch }}

      - name: Pull MegaLinter image
        run: podman pull "${MEGALINTER_IMAGE}"

      - name: Save Podman image cache
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.cache-podman-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.local/share/containers
          key: ${{ steps.cache-podman-images.outputs.cache-primary-key }}

      - name: Run prek on changed files
        if: github.event_name != 'push'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "${BASE_REF}" "${HEAD_REF}" -- . ':!megalinter-reports' || true)
          if printf '%s\n' "${files[@]}" | grep -Eq '^(\.mega-linter\.yml|\.pre-commit-config\.yaml|\.shellcheckrc)$'; then
            files+=(.github/workflows/prek.yml)
            files+=(.github/scripts/mega-linter-runner)
            files+=(charts/azure-k8s-role-assigner/Chart.yaml)
            files+=(tofu/main.tf)
            files+=(tofu/bootstrap.ps1)
            files+=(internal/controller/reconcile_state.go)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to lint"
            exit 0
          fi
          prek run --files "${files[@]}"

      - name: Upload MegaLinter reports
        if: always() && github.event_name != 'push'
        # Check latest: TAG=$(gh api repos/actions/upload-artifact/releases/latest --jq .tag_name); REF_JSON=$(gh api repos/actions/upload-artifact/git/ref/tags/$TAG); TYPE=$(jq -r .object.type <<<"$REF_JSON"); SHA=$(jq -r .object.sha <<<"$REF_JSON"); if [ "$TYPE" = tag ]; then SHA=$(gh api repos/actions/upload-artifact/git/tags/$SHA --jq .object.sha); fi; echo "actions/upload-artifact@$SHA # $TAG"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log

      - name: Check MegaLinter SARIF content
        id: megalinter-sarif
        if: always() && github.event_name != 'push'
        run: |
          set -euo pipefail

          sarif_file=megalinter-reports/megalinter-report.sarif
          if [ ! -s "${sarif_file}" ]; then
            echo "has-results=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          has_results=$(jq -r 'if ((.runs // []) | any((.results // []) | length > 0)) then "true" else "false" end' "${sarif_file}")
          echo "has-results=${has_results}" >> "${GITHUB_OUTPUT}"

      - name: Upload MegaLinter SARIF to GitHub
        if: always() && steps.megalinter-sarif.outputs.has-results == 'true'
        # Check latest: TAG=$(gh api repos/github/codeql-action/releases/latest --jq .tag_name); REF_JSON=$(gh api repos/github/codeql-action/git/ref/tags/$TAG); TYPE=$(jq -r .object.type <<<"$REF_JSON"); SHA=$(jq -r .object.sha <<<"$REF_JSON"); if [ "$TYPE" = tag ]; then SHA=$(gh api repos/github/codeql-action/git/tags/$SHA --jq .object.sha); fi; echo "github/codeql-action/upload-sarif@$SHA # $TAG"
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif

      - name: Remove duplicate code scanning setup comments
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-advanced-security" and (.body | startswith("You are seeing this message because GitHub Code Scanning has recently been set up"))) | .id' \
            | while IFS= read -r comment_id; do
              gh api --method DELETE "repos/${REPOSITORY}/issues/comments/${comment_id}"
            done
