name: Release

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign & Release
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # Create tags, releases, and update release notes.
      packages: write # Publish container images and Helm charts to GHCR.
      id-token: write # Keyless cosign signing of the image and Helm chart.
    env:
      DOCKER_CONFIG: /tmp/docker-config

    steps:
      - name: Checkout
        # Check latest: TAG=$(gh api repos/actions/checkout/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/checkout/git/ref/tags/$TAG --jq .object.sha); echo "actions/checkout@$SHA # $TAG"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        # Check latest: TAG=$(gh api repos/actions/setup-go/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/setup-go/git/ref/tags/$TAG --jq .object.sha); echo "actions/setup-go@$SHA # $TAG"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install cosign
        # Check latest: TAG=$(gh api repos/sigstore/cosign-installer/releases/latest --jq .tag_name); SHA=$(gh api repos/sigstore/cosign-installer/git/ref/tags/$TAG --jq .object.sha); echo "sigstore/cosign-installer@$SHA # $TAG"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install git-cliff
        # Check latest: gh api repos/orhun/git-cliff/releases/latest --jq .tag_name
        run: |
          mkdir -p /tmp/git-cliff-dl
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --strip-components=1 -C /tmp/git-cliff-dl
          sudo mv /tmp/git-cliff-dl/git-cliff /usr/local/bin/git-cliff

      - name: Install Helm
        run: |
          curl -sSfL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz | tar xzf - -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Determine next version
        id: version
        run: |
          NEXT_VERSION="$(git-cliff --config .cliff.yml --bumped-version)"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT_VERSION}"

      - name: Generate release notes
        run: |
          git-cliff --config .cliff.yml --latest --strip header --unreleased --tag "$VERSION" > /tmp/release-notes-base.md
          cp /tmp/release-notes-base.md /tmp/release-notes.md
          .github/scripts/append-release-notes-footer "$VERSION" /tmp/release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package Helm chart
        run: |
          CHART_VERSION="${VERSION#v}"
          helm lint charts/azure-k8s-role-assigner
          # Package outside dist/: GoReleaser runs with --clean and deletes
          # dist/ before the chart is pushed after the image.
          helm package charts/azure-k8s-role-assigner \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination "${RUNNER_TEMP}/chart"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create and push tag
        # Idempotent so a failed release can be re-run without manual cleanup:
        # GoReleaser derives the version from this tag, so it has to exist
        # before publishing and is therefore left behind whenever a later step
        # fails. Reusing a tag that already points at this commit is safe; one
        # pointing elsewhere means the version was already released.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          remote_commit="$(git ls-remote --tags origin "refs/tags/${VERSION}^{}" | cut -f1)"
          if [ -n "${remote_commit}" ]; then
            if [ "${remote_commit}" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${VERSION} already exists on a different commit"
              exit 1
            fi
            echo "Tag ${VERSION} already points at HEAD; reusing it."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Prepare registry auth config
        run: mkdir -p "$DOCKER_CONFIG"

      - name: Login to GHCR
        # Check latest: TAG=$(gh api repos/redhat-actions/podman-login/releases/latest --jq .tag_name); SHA=$(gh api repos/redhat-actions/podman-login/git/ref/tags/$TAG --jq .object.sha); echo "redhat-actions/podman-login@$SHA # $TAG"
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: ${{ env.DOCKER_CONFIG }}/config.json

      - name: Set up Podman Docker compatibility
        run: |
          set -euo pipefail

          sudo systemctl stop docker.service docker.socket containerd.service || true
          if sudo systemctl is-active --quiet docker.service || sudo systemctl is-active --quiet docker.socket; then
            echo "::error::Docker daemon is still running"
            exit 1
          fi

          runtime_dir="${XDG_RUNTIME_DIR:-${RUNNER_TEMP}/podman-runtime}"
          socket_path="${runtime_dir}/podman/podman.sock"
          mkdir -p "${runtime_dir}/podman"
          chmod 700 "${runtime_dir}"
          export XDG_RUNTIME_DIR="${runtime_dir}"

          # Fail loudly here rather than letting the wait loop below time out
          # with no explanation. Podman refuses to run at all when
          # XDG_RUNTIME_DIR is unusable, and the socket then never appears.
          podman info >/dev/null

          service_log="${RUNNER_TEMP}/podman-service.log"
          if [ ! -S "${socket_path}" ]; then
            # Redirect to a file: a backgrounded process writing to the step's
            # stdout is not reliably flushed before the step exits, which is
            # why earlier failures here produced zero diagnostic output.
            podman system service --time=0 "unix://${socket_path}" \
              >"${service_log}" 2>&1 &
            service_pid=$!
          fi
          for _ in $(seq 30); do
            if [ -S "${socket_path}" ]; then
              break
            fi
            if [ -n "${service_pid:-}" ] && ! kill -0 "${service_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ ! -S "${socket_path}" ]; then
            echo "::error::Podman Docker-compatible socket did not start"
            if [ -f "${service_log}" ]; then
              echo "--- podman system service output ---"
              cat "${service_log}"
            fi
            exit 1
          fi

          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "${GITHUB_ENV}"
          echo "DOCKER_HOST=unix://${socket_path}" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        # Check latest: TAG=$(gh api repos/goreleaser/goreleaser-action/releases/latest --jq .tag_name); SHA=$(gh api repos/goreleaser/goreleaser-action/git/ref/tags/$TAG --jq .object.sha); echo "goreleaser/goreleaser-action@$SHA # $TAG"
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/dronenb/azure-k8s-role-assigner
          COSIGN_YES: "true"

      - name: Push Helm chart
        id: chart
        # Published after the image so a successful chart push never advertises
        # an image tag that does not exist yet. The chart's default image tag is
        # its appVersion, so the two are released as a matched pair.
        run: |
          helm push "${RUNNER_TEMP}"/chart/azure-k8s-role-assigner-*.tgz oci://ghcr.io/dronenb/charts --registry-config "$DOCKER_CONFIG/config.json" | tee /tmp/helm-push.txt
          CHART_DIGEST=""
          while IFS= read -r line; do
            case "$line" in
              "Digest: "*) CHART_DIGEST="${line#Digest: }" ;;
            esac
          done < /tmp/helm-push.txt
          if [ -z "$CHART_DIGEST" ]; then
            echo "Failed to determine Helm chart digest" >&2
            exit 1
          fi
          echo "digest=${CHART_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart
        # Keyless signing, matching the container image. The chart is signed by
        # digest rather than tag: cosign resolves a tag to a digest anyway, and
        # pinning here keeps the signature attached to the exact pushed artifact.
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "ghcr.io/dronenb/charts/azure-k8s-role-assigner@${CHART_DIGEST}"

      - name: Upload Helm chart to GitHub Release
        run: gh release upload "$VERSION" "${RUNNER_TEMP}"/chart/azure-k8s-role-assigner-*.tgz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Update release notes with published digests
        run: |
          set -euo pipefail
          IMAGE_DIGEST=""
          IMAGE_REF="ghcr.io/dronenb/azure-k8s-role-assigner:${VERSION#v}"
          # GoReleaser writes "<hex>  <image-ref>" per line, with the
          # algorithm prefix stripped from the digest.
          while read -r digest ref; do
            if [ "$ref" = "$IMAGE_REF" ] && [ -n "$digest" ]; then
              IMAGE_DIGEST="sha256:${digest#sha256:}"
              break
            fi
          done < dist/azure-k8s-role-assigner_digests.txt
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "Failed to determine image digest" >&2
            exit 1
          fi
          cp /tmp/release-notes-base.md /tmp/release-notes.md
          .github/scripts/append-release-notes-footer "$VERSION" /tmp/release-notes.md "$IMAGE_DIGEST" "${CHART_DIGEST}"
          gh release edit "$VERSION" --notes-file /tmp/release-notes.md
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
