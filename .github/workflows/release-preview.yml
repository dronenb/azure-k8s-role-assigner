name: Release Preview

on:
  pull_request:
    types: [labeled, synchronize, opened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Release Preview
    if: contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Check latest: TAG=$(gh api repos/actions/checkout/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/checkout/git/ref/tags/$TAG --jq .object.sha); echo "actions/checkout@$SHA # $TAG"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        # Check latest: TAG=$(gh api repos/actions/setup-go/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/setup-go/git/ref/tags/$TAG --jq .object.sha); echo "actions/setup-go@$SHA # $TAG"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install git-cliff
        # Check latest: gh api repos/orhun/git-cliff/releases/latest --jq .tag_name
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --strip-components=1 -C /tmp git-cliff-2.13.1/git-cliff
          sudo mv /tmp/git-cliff /usr/local/bin/git-cliff

      - name: Install Helm
        run: |
          curl -sSfL https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz | tar xzf - -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Determine next version
        id: version
        run: |
          NEXT_VERSION="$(git-cliff --bumped-version)"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT_VERSION}"

      - name: Generate release notes preview
        id: notes
        run: |
          git-cliff --latest --strip header --unreleased --tag ${{ steps.version.outputs.version }} > /tmp/release-notes.md
          .github/scripts/append-release-notes-footer "${{ steps.version.outputs.version }}" /tmp/release-notes.md
          echo "## Release Preview: ${{ steps.version.outputs.version }}" > /tmp/comment.md
          echo "" >> /tmp/comment.md
          cat /tmp/release-notes.md >> /tmp/comment.md

      - name: Package Helm chart
        run: |
          CHART_VERSION="${VERSION#v}"
          helm lint charts/azure-k8s-role-assigner
          helm package charts/azure-k8s-role-assigner \
            --version "$CHART_VERSION" \
            --app-version "$VERSION" \
            --destination dist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: GoReleaser dry run
        # Check latest: TAG=$(gh api repos/goreleaser/goreleaser-action/releases/latest --jq .tag_name); SHA=$(gh api repos/goreleaser/goreleaser-action/git/ref/tags/$TAG --jq .object.sha); echo "goreleaser/goreleaser-action@$SHA # $TAG"
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --snapshot --skip=publish
        env:
          KO_DOCKER_REPO: ghcr.io/dronenb/azure-k8s-role-assigner

      - name: Post release preview as PR comment
        # Check latest: TAG=$(gh api repos/actions/github-script/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/github-script/git/ref/tags/$TAG --jq .object.sha); echo "actions/github-script@$SHA # $TAG"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Release Preview:')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
