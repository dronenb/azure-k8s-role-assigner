name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "charts/**"
      - "e2e/**"
      - ".goreleaser.yml"
      - ".ko.yaml"
      - "Taskfile.yml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # E2E provisions real Entra infrastructure. Do not cancel a running workflow
  # on new commits, or Terraform cleanup steps may not get a chance to run.
  cancel-in-progress: false

jobs:
  unit:
    name: Unit Tests (fmt, vet, test)
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Check latest: TAG=$(gh api repos/actions/checkout/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/checkout/git/ref/tags/$TAG --jq .object.sha); echo "actions/checkout@$SHA # $TAG"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        # Check latest: TAG=$(gh api repos/actions/setup-go/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/setup-go/git/ref/tags/$TAG --jq .object.sha); echo "actions/setup-go@$SHA # $TAG"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        # Check latest: TAG=$(gh api repos/go-task/setup-task/releases/latest --jq .tag_name); SHA=$(gh api repos/go-task/setup-task/git/ref/tags/$TAG --jq .object.sha); echo "go-task/setup-task@$SHA # $TAG"
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.x

      - name: Run unit tests (fmt, vet, test with coverage)
        run: task test

      - name: Verify formatting left no changes
        run: |
          if ! git diff --quiet; then
            echo "::error::go fmt produced changes. Run 'task fmt' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Upload coverage report
        # Check latest: TAG=$(gh api repos/actions/upload-artifact/releases/latest --jq .tag_name); REF_JSON=$(gh api repos/actions/upload-artifact/git/ref/tags/$TAG); TYPE=$(jq -r .object.type <<<"$REF_JSON"); SHA=$(jq -r .object.sha <<<"$REF_JSON"); if [ "$TYPE" = tag ]; then SHA=$(gh api repos/actions/upload-artifact/git/tags/$SHA --jq .object.sha); fi; echo "actions/upload-artifact@$SHA # $TAG"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Upload govulncheck SARIF results to code scanning.

    steps:
      - name: Checkout
        # Check latest: TAG=$(gh api repos/actions/checkout/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/checkout/git/ref/tags/$TAG --jq .object.sha); echo "actions/checkout@$SHA # $TAG"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run govulncheck
        # Check latest: TAG=$(gh api repos/golang/govulncheck-action/releases/latest --jq .tag_name); SHA=$(gh api repos/golang/govulncheck-action/git/ref/tags/$TAG --jq .object.sha); echo "golang/govulncheck-action@$SHA # $TAG"
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...
          output-format: sarif
          output-file: govulncheck.sarif
          repo-checkout: false

      - name: Upload govulncheck SARIF artifact
        if: always() && hashFiles('govulncheck.sarif') != ''
        # Check latest: TAG=$(gh api repos/actions/upload-artifact/releases/latest --jq .tag_name); REF_JSON=$(gh api repos/actions/upload-artifact/git/ref/tags/$TAG); TYPE=$(jq -r .object.type <<<"$REF_JSON"); SHA=$(jq -r .object.sha <<<"$REF_JSON"); if [ "$TYPE" = tag ]; then SHA=$(gh api repos/actions/upload-artifact/git/tags/$SHA --jq .object.sha); fi; echo "actions/upload-artifact@$SHA # $TAG"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-sarif
          path: govulncheck.sarif

      - name: Upload govulncheck SARIF to GitHub
        if: always() && hashFiles('govulncheck.sarif') != ''
        # Check latest v4: TAG_SHA=$(gh api repos/github/codeql-action/git/ref/tags/v4 --jq .object.sha); SHA=$(gh api repos/github/codeql-action/git/tags/$TAG_SHA --jq .object.sha); echo "github/codeql-action/upload-sarif@$SHA # v4"
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: govulncheck.sarif

      - name: Fail on govulncheck findings
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: End-to-End (kind + Entra)
    needs: unit
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # azure/login Entra workload identity federation.
    env:
      KIND_EXPERIMENTAL_PROVIDER: podman

    steps:
      - name: Checkout
        # Check latest: TAG=$(gh api repos/actions/checkout/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/checkout/git/ref/tags/$TAG --jq .object.sha); echo "actions/checkout@$SHA # $TAG"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # Check latest: TAG=$(gh api repos/actions/setup-go/releases/latest --jq .tag_name); SHA=$(gh api repos/actions/setup-go/git/ref/tags/$TAG --jq .object.sha); echo "actions/setup-go@$SHA # $TAG"
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        # Check latest: TAG=$(gh api repos/go-task/setup-task/releases/latest --jq .tag_name); SHA=$(gh api repos/go-task/setup-task/git/ref/tags/$TAG --jq .object.sha); echo "go-task/setup-task@$SHA # $TAG"
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.x

      - name: Install ko
        # Check latest: gh api repos/ko-build/ko/releases/latest --jq .tag_name
        run: |
          curl -sSfL https://github.com/ko-build/ko/releases/download/v0.18.1/ko_0.18.1_Linux_x86_64.tar.gz | tar xzf - -C /usr/local/bin ko

      - name: Install kind
        # Check latest: gh api repos/kubernetes-sigs/kind/releases/latest --jq .tag_name
        run: |
          curl -sSfLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Set up OpenTofu
        # Check latest: TAG=$(gh api repos/opentofu/setup-opentofu/releases/latest --jq .tag_name); SHA=$(gh api repos/opentofu/setup-opentofu/git/ref/tags/$TAG --jq .object.sha); echo "opentofu/setup-opentofu@$SHA # $TAG"
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1

      - name: Login to Azure
        # Check latest: TAG=$(gh api repos/azure/login/releases/latest --jq .tag_name); SHA=$(gh api repos/azure/login/git/ref/tags/$TAG --jq .object.sha); echo "azure/login@$SHA # $TAG"
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        # Check latest: TAG=$(gh api repos/azure/setup-kubectl/releases/latest --jq .tag_name); SHA=$(gh api repos/azure/setup-kubectl/git/ref/tags/$TAG --jq .object.sha); echo "azure/setup-kubectl@$SHA # $TAG"
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install Helm
        run: |
          curl -sSfL https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz | tar xzf - -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install kubelogin
        # Check latest action: TAG=$(gh api repos/azure/use-kubelogin/releases/latest --jq .tag_name); SHA=$(gh api repos/azure/use-kubelogin/git/ref/tags/$TAG --jq .object.sha); echo "azure/use-kubelogin@$SHA # $TAG"
        # Check latest tool:   gh api repos/Azure/kubelogin/releases/latest --jq .tag_name
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: "v0.2.18"

      - name: Run e2e tests
        env:
          E2E_TEST_USER_PASSWORD_SECRET_NAME: ${{ vars.E2E_TEST_USER_PASSWORD_SECRET_NAME }}
          E2E_TEST_USER_UPN: ${{ vars.E2E_TEST_USER_UPN }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
          SIGNING_KEY_SECRET_NAME: ${{ vars.SIGNING_KEY_SECRET_NAME }}
          TEST_GROUP_CRB_ID: ${{ vars.TEST_GROUP_CRB_ID }}
          TEST_GROUP_RB_ID: ${{ vars.TEST_GROUP_RB_ID }}
          TEST_GROUP_ARGOCD_CONFIGMAP_ID: ${{ vars.TEST_GROUP_ARGOCD_CONFIGMAP_ID }}
          TEST_GROUP_ARGOCD_APPPROJECT_ID: ${{ vars.TEST_GROUP_ARGOCD_APPPROJECT_ID }}
          TF_VAR_name_suffix: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: task e2e

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          kubectl get all -A
          kubectl get rolebinding,clusterrolebinding -A
          kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner --tail=200

      - name: Cleanup Kubernetes resources
        if: always()
        run: task e2e:cleanup

      - name: Delete kind cluster
        if: always()
        run: task e2e:cluster-down

      - name: Destroy Entra resources
        if: always()
        env:
          OIDC_ISSUER_URL: ${{ vars.OIDC_ISSUER_URL }}
          E2E_TEST_USER_UPN: ${{ vars.E2E_TEST_USER_UPN }}
          TEST_GROUP_CRB_ID: ${{ vars.TEST_GROUP_CRB_ID }}
          TEST_GROUP_RB_ID: ${{ vars.TEST_GROUP_RB_ID }}
          TEST_GROUP_ARGOCD_CONFIGMAP_ID: ${{ vars.TEST_GROUP_ARGOCD_CONFIGMAP_ID }}
          TEST_GROUP_ARGOCD_APPPROJECT_ID: ${{ vars.TEST_GROUP_ARGOCD_APPPROJECT_ID }}
        run: task e2e:infra-down
