version: "3"

vars:
  IMG: '{{.IMG | default "ghcr.io/dronenb/azure-k8s-role-assigner"}}'
  AZURE_SERVICE_PRINCIPALS: "{{.AZURE_SERVICE_PRINCIPALS}}"
  AZURE_TENANT_ID: "{{.AZURE_TENANT_ID}}"
  AZURE_CLIENT_ID: "{{.AZURE_CLIENT_ID}}"
  AZURE_CLIENT_SECRET: "{{.AZURE_CLIENT_SECRET}}"
  AZURE_APP_ROLE_ID: "{{.AZURE_APP_ROLE_ID}}"
  E2E_IMAGE: '{{.E2E_IMAGE | default "e2e.local/azure-k8s-role-assigner:e2e"}}'
  E2E_NS: '{{.E2E_NS | default "test-e2e"}}'
  KIND_CLUSTER_NAME: '{{.KIND_CLUSTER_NAME | default "e2e"}}'
  KIND_LOCAL_CLUSTER_NAME: '{{.KIND_LOCAL_CLUSTER_NAME | default "local"}}'
  KIND_LOCAL_IMAGE: '{{.KIND_LOCAL_IMAGE | default "localhost/azure-k8s-role-assigner:dev"}}'
  KIND_LOCAL_TAG: '{{.KIND_LOCAL_TAG | default "dev"}}'
  KIND_LOCAL_IMG_TARBALL: '{{.KIND_LOCAL_IMG_TARBALL | default "kind-image.tar"}}'
  OIDC_ISSUER_URL: "{{.OIDC_ISSUER_URL}}"
  KEY_VAULT_NAME: "{{.KEY_VAULT_NAME}}"
  SIGNING_KEY_SECRET_NAME: '{{.SIGNING_KEY_SECRET_NAME | default "sa-signing-key"}}'
  E2E_TEST_USER_PASSWORD_SECRET_NAME: '{{.E2E_TEST_USER_PASSWORD_SECRET_NAME | default "e2e-test-user-password"}}'
  TEST_GROUP_CRB_ID: "{{.TEST_GROUP_CRB_ID}}"
  TEST_GROUP_RB_ID: "{{.TEST_GROUP_RB_ID}}"
  TEST_GROUP_ARGOCD_CONFIGMAP_ID: "{{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}}"
  TEST_GROUP_ARGOCD_APPPROJECT_ID: "{{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}"
  ARGOCD_OPERATOR_VERSION: '{{.ARGOCD_OPERATOR_VERSION | default "v0.18.0"}}'
  E2E_TEST_USER_UPN: "{{.E2E_TEST_USER_UPN}}"
  E2E_TEST_USER_PASSWORD: "{{.E2E_TEST_USER_PASSWORD}}"
  SA_KEY_DIR: '{{.SA_KEY_DIR | default ".e2e"}}'
  SA_KEY_FILE: '{{.SA_KEY_DIR | default ".e2e"}}/sa-signing.key'
  E2E_TEST_USER_PASSWORD_FILE: '{{.SA_KEY_DIR | default ".e2e"}}/e2e-test-user-password'
  TOFU_BASE_PARALLELISM: '{{.TOFU_BASE_PARALLELISM | default "25"}}'

tasks:
  default:
    cmds:
      - task: build

  # --- Development ---

  fmt:
    desc: Run go fmt against code.
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet against code.
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    cmds:
      - go vet ./...

  test:
    desc: Run tests.
    deps: [fmt, vet]
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - cover.out
    cmds:
      - go test ./... -coverprofile cover.out

  build:
    desc: Build manager binary.
    deps: [fmt, vet]
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/manager
    cmds:
      - go build -o bin/manager cmd/main.go

  run:
    desc: Run a controller from your host.
    deps: [fmt, vet]
    cmds:
      - go run ./cmd/main.go

  # --- Image ---

  build-image:
    desc: Build container image as a tarred OCI layout using ko (no daemon required).
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - .ko.yaml
    generates:
      - '{{.IMG_TARBALL | default "image.tar"}}'
    preconditions:
      - sh: command -v jq >/dev/null
        msg: jq is required to annotate the OCI layout image reference
    cmds:
      - |
        set -euo pipefail
        image_tarball='{{.IMG_TARBALL | default "image.tar"}}'
        image_ref='{{.IMG}}:{{.TAG | default "latest"}}'
        oci_layout=.ko-oci-layout
        rm -rf "${oci_layout}"
        mkdir -p "${oci_layout}"
        trap 'rm -rf "${oci_layout}"' EXIT

        ko build \
          --bare \
          --tags='{{.TAG | default "latest"}}' \
          --push=false \
          --oci-layout-path="${oci_layout}" \
          --platform='{{.PLATFORM | default (printf "linux/%s" ARCH)}}' \
          ./cmd

        index_tmp="${oci_layout}/index.json.tmp"
        jq --arg image_ref "${image_ref}" \
          '.manifests[0].annotations = ((.manifests[0].annotations // {}) + {"org.opencontainers.image.ref.name": $image_ref})' \
          "${oci_layout}/index.json" > "${index_tmp}"
        mv "${index_tmp}" "${oci_layout}/index.json"

        tar -C "${oci_layout}" -cf "${image_tarball}" .
    env:
      KO_DOCKER_REPO: "{{.IMG}}"

  # --- Deployment ---

  deploy:
    desc: Deploy controller to the K8s cluster specified in ~/.kube/config.
    cmds:
      - >-
        helm upgrade --install azure-k8s-role-assigner charts/azure-k8s-role-assigner
        --namespace azure-k8s-role-assigner
        --create-namespace

  undeploy:
    desc: Undeploy controller from the K8s cluster specified in ~/.kube/config.
    cmds:
      - helm uninstall azure-k8s-role-assigner --namespace azure-k8s-role-assigner --ignore-not-found

  # --- Local kind Workflow ---

  kind:create-internal:
    desc: Internal task to create a kind cluster with optional config.
    vars:
      KIND_CLUSTER_NAME: "{{.KIND_CLUSTER_NAME | default .KIND_LOCAL_CLUSTER_NAME}}"
      KIND_CONFIG_FILE: '{{.KIND_CONFIG_FILE | default ""}}'
    cmds:
      - |
        set -euo pipefail
        if [ "$(uname -s)" != "Linux" ]; then
          if ! podman machine list --format '{{`{{.Name}}`}}' 2>/dev/null | grep -q .; then
            echo "No podman machine found, initializing..."
            podman machine init
          fi
          if ! podman machine list --format '{{`{{.Running}}`}}' 2>/dev/null | grep -qi true; then
            echo "Starting podman machine..."
            podman machine start
          fi
        fi
      - |
        set -euo pipefail
        if kind get clusters 2>/dev/null | grep -q '^{{.KIND_CLUSTER_NAME}}$'; then
          echo "kind cluster '{{.KIND_CLUSTER_NAME}}' already exists"
          exit 0
        fi

        KIND_CREATE_ARGS=(--name {{.KIND_CLUSTER_NAME}} --wait 5m)
        if [ -n "{{.KIND_CONFIG_FILE}}" ]; then
          KIND_CREATE_ARGS+=(--config {{.KIND_CONFIG_FILE}})
        fi

        KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster "${KIND_CREATE_ARGS[@]}"
      - kubectl config use-context kind-{{.KIND_CLUSTER_NAME}}
      - kubectl cluster-info
    status:
      - kind get clusters 2>/dev/null | grep -q '^{{.KIND_CLUSTER_NAME}}$'

  kind:delete-internal:
    desc: Internal task to delete a kind cluster.
    vars:
      KIND_CLUSTER_NAME: "{{.KIND_CLUSTER_NAME | default .KIND_LOCAL_CLUSTER_NAME}}"
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  kind:up:
    desc: Create local kind cluster for day-to-day development.
    cmds:
      - task: kind:create-internal
        vars:
          KIND_CLUSTER_NAME: "{{.KIND_LOCAL_CLUSTER_NAME}}"
    status:
      - kind get clusters 2>/dev/null | grep -q '^{{.KIND_LOCAL_CLUSTER_NAME}}$'

  kind:down:
    desc: Delete local kind development cluster.
    cmds:
      - task: kind:delete-internal
        vars:
          KIND_CLUSTER_NAME: "{{.KIND_LOCAL_CLUSTER_NAME}}"

  kind:build-image:
    desc: Build local controller image tarball for kind.
    cmds:
      - task: build-image
        vars:
          IMG: localhost/azure-k8s-role-assigner
          TAG: "{{.KIND_LOCAL_TAG}}"
          IMG_TARBALL: "{{.KIND_LOCAL_IMG_TARBALL}}"

  kind:load-image:
    desc: Load local controller image tarball into kind.
    preconditions:
      - test -f {{.KIND_LOCAL_IMG_TARBALL}}
    cmds:
      - kind load image-archive {{.KIND_LOCAL_IMG_TARBALL}} --name {{.KIND_LOCAL_CLUSTER_NAME}}

  kind:deploy:
    desc: Deploy controller to local kind cluster with explicit Azure env vars.
    preconditions:
      - sh: '[ -n "{{.AZURE_SERVICE_PRINCIPALS}}" ]'
        msg: "AZURE_SERVICE_PRINCIPALS must be set"
      - sh: '[ -n "{{.AZURE_TENANT_ID}}" ]'
        msg: "AZURE_TENANT_ID must be set"
      - sh: '[ -n "{{.AZURE_CLIENT_ID}}" ]'
        msg: "AZURE_CLIENT_ID must be set"
      - sh: '[ -n "{{.AZURE_APP_ROLE_ID}}" ]'
        msg: "AZURE_APP_ROLE_ID must be set (export AZURE_APP_ROLE_ID=$(cd e2e/tofu && tofu output -raw cluster_app_role_id))"
    cmds:
      - kubectl config use-context kind-{{.KIND_LOCAL_CLUSTER_NAME}}
      - |
        set -euo pipefail
        HELM_ARGS=(
          upgrade --install azure-k8s-role-assigner charts/azure-k8s-role-assigner
          --namespace azure-k8s-role-assigner
          --create-namespace
          --set replicaCount=1
          --set image.repository=localhost/azure-k8s-role-assigner
          --set image.tag={{.KIND_LOCAL_TAG}}
          --set image.pullPolicy=Never
          --set-literal azure.servicePrincipals="{{.AZURE_SERVICE_PRINCIPALS}}"
          --set-string azure.tenantId="{{.AZURE_TENANT_ID}}"
          --set-string azure.clientId="{{.AZURE_CLIENT_ID}}"
          --set-string azure.appRoleId="{{.AZURE_APP_ROLE_ID}}"
          --set-string azure.tokenCredentials=prod
        )
        if [ -n "{{.AZURE_CLIENT_SECRET}}" ]; then
          HELM_ARGS+=(--set-string azure.clientSecret="{{.AZURE_CLIENT_SECRET}}")
        fi
        helm "${HELM_ARGS[@]}"
      - kubectl rollout status deployment/azure-k8s-role-assigner -n azure-k8s-role-assigner --timeout=5m

  kind:logs:
    desc: Tail controller logs from local kind deployment.
    cmds:
      - kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner -f

  kind:run:
    desc: End-to-end local kind workflow (up, build, load, deploy).
    cmds:
      - task: kind:up
      - task: kind:build-image
      - task: kind:load-image
      - task: kind:deploy

  # --- Static Infrastructure ---

  tofu:init:
    desc: Initialize static OpenTofu infrastructure.
    dir: tofu
    cmds:
      - tofu init -input=false

  tofu:plan:
    desc: Plan static OpenTofu infrastructure with higher parallelism for many Entra groups.
    dir: tofu
    cmds:
      - tofu plan -input=false -parallelism={{.TOFU_BASE_PARALLELISM}} {{.CLI_ARGS}}

  tofu:apply:
    desc: Apply static OpenTofu infrastructure with higher parallelism for many Entra groups.
    dir: tofu
    cmds:
      - tofu apply -input=false -parallelism={{.TOFU_BASE_PARALLELISM}} {{.CLI_ARGS}}

  tofu:destroy:
    desc: Destroy static OpenTofu infrastructure with higher parallelism for many Entra groups.
    dir: tofu
    cmds:
      - tofu destroy -input=false -parallelism={{.TOFU_BASE_PARALLELISM}} {{.CLI_ARGS}}

  # --- E2E Testing ---

  e2e:
    desc: Run full end-to-end test suite (kind + Entra ID).
    cmds:
      - task: e2e:infra-up
      - task: e2e:cluster-up
      - task: e2e:argocd-up
      - task: e2e:build-image
      - task: e2e:load-image
      - task: e2e:deploy
      - task: e2e:create-rbac
      - task: e2e:create-argocd-rbac
      - task: e2e:verify
      - task: e2e:verify-argocd
      - task: e2e:verify-deletion

  e2e:ci:
    desc: Run e2e suite in CI (downloads stable key from Key Vault first).
    cmds:
      - task: e2e:download-key
      - task: e2e:download-user-password
      - task: e2e:infra-up
      - task: e2e:cluster-up
      - task: e2e:argocd-up
      - task: e2e:build-image
      - task: e2e:load-image
      - task: e2e:deploy
      - task: e2e:create-rbac
      - task: e2e:create-argocd-rbac
      - task: e2e:verify
      - task: e2e:verify-argocd
      - task: e2e:verify-deletion

  e2e:download-key:
    desc: Download the stable SA signing key from Key Vault.
    preconditions:
      - sh: '[ -n "{{.KEY_VAULT_NAME}}" ]'
        msg: "KEY_VAULT_NAME must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.SIGNING_KEY_SECRET_NAME}}" ]'
        msg: "SIGNING_KEY_SECRET_NAME must be set (from tofu/ outputs)"
    cmds:
      - |
        set -euo pipefail
        mkdir -p "{{.SA_KEY_DIR}}"
        az keyvault secret show \
          --vault-name "{{.KEY_VAULT_NAME}}" \
          --name "{{.SIGNING_KEY_SECRET_NAME}}" \
          --query value -o tsv > "{{.SA_KEY_FILE}}"
        chmod 600 "{{.SA_KEY_FILE}}"
        echo "Signing key written to {{.SA_KEY_FILE}}"
    status:
      - test -f "{{.SA_KEY_FILE}}"

  e2e:download-user-password:
    desc: Download the static e2e test user password from Key Vault.
    preconditions:
      - sh: '[ -n "{{.KEY_VAULT_NAME}}" ]'
        msg: "KEY_VAULT_NAME must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.E2E_TEST_USER_PASSWORD_SECRET_NAME}}" ]'
        msg: "E2E_TEST_USER_PASSWORD_SECRET_NAME must be set (from tofu/ outputs)"
    cmds:
      - |
        set -euo pipefail
        mkdir -p "{{.SA_KEY_DIR}}"
        az keyvault secret show \
          --vault-name "{{.KEY_VAULT_NAME}}" \
          --name "{{.E2E_TEST_USER_PASSWORD_SECRET_NAME}}" \
          --query value -o tsv > "{{.E2E_TEST_USER_PASSWORD_FILE}}"
        chmod 600 "{{.E2E_TEST_USER_PASSWORD_FILE}}"
        echo "e2e test user password written to {{.E2E_TEST_USER_PASSWORD_FILE}}"
    status:
      - test -f "{{.E2E_TEST_USER_PASSWORD_FILE}}"

  e2e:infra-up:
    desc: Provision Entra ID resources with OpenTofu.
    dir: e2e/tofu
    preconditions:
      - sh: '[ -n "{{.OIDC_ISSUER_URL}}" ]'
        msg: "OIDC_ISSUER_URL must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.TEST_GROUP_CRB_ID}}" ]'
        msg: "TEST_GROUP_CRB_ID must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.TEST_GROUP_RB_ID}}" ]'
        msg: "TEST_GROUP_RB_ID must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}}" ]'
        msg: "TEST_GROUP_ARGOCD_CONFIGMAP_ID must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}" ]'
        msg: "TEST_GROUP_ARGOCD_APPPROJECT_ID must be set (from tofu/ outputs)"
      - sh: '[ -n "{{.E2E_TEST_USER_UPN}}" ]'
        msg: "E2E_TEST_USER_UPN must be set (from tofu/ outputs)"
    cmds:
      - tofu init -input=false
      - >-
        tofu apply -auto-approve -input=false
        -var="oidc_issuer_url={{.OIDC_ISSUER_URL}}"
        -var="static_oidc_issuer_url={{.OIDC_ISSUER_URL}}"
        -var="test_group_crb_id={{.TEST_GROUP_CRB_ID}}"
        -var="test_group_rb_id={{.TEST_GROUP_RB_ID}}"
        -var="test_group_argocd_configmap_id={{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}}"
        -var="test_group_argocd_appproject_id={{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}"
        -var="e2e_test_user_upn={{.E2E_TEST_USER_UPN}}"
        {{if .TF_VAR_name_suffix}}-var="name_suffix={{.TF_VAR_name_suffix}}"{{end}}

  e2e:infra-down:
    desc: Destroy Entra ID resources with OpenTofu.
    dir: e2e/tofu
    preconditions:
      - sh: '[ -n "{{.E2E_TEST_USER_UPN}}" ]'
        msg: "E2E_TEST_USER_UPN must be set (from tofu/ outputs)"
    cmds:
      - |
        set -euo pipefail

        for attempt in 1 2 3; do
          if tofu destroy -auto-approve -input=false \
            -var="oidc_issuer_url={{.OIDC_ISSUER_URL}}" \
            -var="static_oidc_issuer_url={{.OIDC_ISSUER_URL}}" \
            -var="test_group_crb_id={{.TEST_GROUP_CRB_ID | default "placeholder"}}" \
            -var="test_group_rb_id={{.TEST_GROUP_RB_ID | default "placeholder"}}" \
            -var="test_group_argocd_configmap_id={{.TEST_GROUP_ARGOCD_CONFIGMAP_ID | default "placeholder"}}" \
            -var="test_group_argocd_appproject_id={{.TEST_GROUP_ARGOCD_APPPROJECT_ID | default "placeholder"}}" \
            -var="e2e_test_user_upn={{.E2E_TEST_USER_UPN}}"; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "OpenTofu destroy failed after ${attempt} attempts" >&2
            exit 1
          fi

          sleep_seconds=$((attempt * 20))
          echo "OpenTofu destroy failed; retrying in ${sleep_seconds}s (${attempt}/3)" >&2
          sleep "$sleep_seconds"
        done

  e2e:infra-output:
    desc: Export OpenTofu outputs as environment variables.
    dir: e2e/tofu
    cmds:
      - |
        set -euo pipefail
        echo "AZURE_TENANT_ID=$(tofu output -raw tenant_id)"
        echo "AZURE_CLIENT_ID=$(tofu output -raw controller_client_id)"
        echo "AZURE_SERVICE_PRINCIPALS=$(tofu output -raw cluster_sp_object_id)"
        echo "AZURE_APP_ROLE_ID=$(tofu output -raw cluster_app_role_id)"
        echo "ARGOCD_AZURE_SERVICE_PRINCIPALS=$(tofu output -raw argocd_sp_object_id)"
        echo "ARGOCD_AZURE_APP_ROLE_ID=$(tofu output -raw argocd_app_role_id)"
        echo "ARGOCD_APP_CLIENT_ID=$(tofu output -raw argocd_app_client_id)"
        echo "CLUSTER_APP_CLIENT_ID=$(tofu output -raw cluster_app_client_id)"
        echo "E2E_GROUP_CRB_ID=$(tofu output -raw test_group_crb_id)"
        echo "E2E_GROUP_RB_ID=$(tofu output -raw test_group_rb_id)"
        echo "E2E_GROUP_ARGOCD_CONFIGMAP_ID=$(tofu output -raw test_group_argocd_configmap_id)"
        echo "E2E_GROUP_ARGOCD_APPPROJECT_ID=$(tofu output -raw test_group_argocd_appproject_id)"

  e2e:cluster-up:
    desc: Create kind cluster for e2e tests.
    preconditions:
      - sh: '[ -n "{{.OIDC_ISSUER_URL}}" ]'
        msg: "OIDC_ISSUER_URL must be set"
    cmds:
      - |
        set -euo pipefail
        # Get cluster app client ID and tenant from tofu output
        eval "$(task e2e:infra-output)"
        OIDC_CLIENT_ID="${CLUSTER_APP_CLIENT_ID}"
        OIDC_TENANT_ISSUER="https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"

        # Build kind config
        CONFIG=$(mktemp)

        if [ -f "{{.SA_KEY_FILE}}" ]; then
          echo "Using stable signing key from {{.SA_KEY_FILE}}"
          SA_KEY_PATH="$(cd "$(dirname '{{.SA_KEY_FILE}}')" && pwd)/$(basename '{{.SA_KEY_FILE}}')"
          cat > "$CONFIG" <<EOF
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraMounts:
          - hostPath: ${SA_KEY_PATH}
            containerPath: /etc/kubernetes/pki/sa-stable.key
            readOnly: true
          kubeadmConfigPatches:
          - |
            kind: ClusterConfiguration
            apiServer:
              extraArgs:
                service-account-signing-key-file: /etc/kubernetes/pki/sa-stable.key
                service-account-key-file: /etc/kubernetes/pki/sa-stable.key
                service-account-issuer: {{.OIDC_ISSUER_URL}}
                oidc-issuer-url: ${OIDC_TENANT_ISSUER}
                oidc-client-id: ${OIDC_CLIENT_ID}
                oidc-groups-claim: groups
                oidc-username-claim: sub
            controllerManager:
              extraArgs:
                service-account-private-key-file: /etc/kubernetes/pki/sa-stable.key
        EOF
        else
          echo "No stable key found — kind will generate its own SA key"
          cat > "$CONFIG" <<EOF
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          kubeadmConfigPatches:
          - |
            kind: ClusterConfiguration
            apiServer:
              extraArgs:
                service-account-issuer: {{.OIDC_ISSUER_URL}}
                oidc-issuer-url: ${OIDC_TENANT_ISSUER}
                oidc-client-id: ${OIDC_CLIENT_ID}
                oidc-groups-claim: groups
                oidc-username-claim: sub
        EOF
        fi

        task kind:create-internal KIND_CLUSTER_NAME={{.KIND_CLUSTER_NAME}} KIND_CONFIG_FILE="$CONFIG"
        rm -f "$CONFIG"
    status:
      - kind get clusters 2>/dev/null | grep -q '^{{.KIND_CLUSTER_NAME}}$'

  e2e:argocd-up:
    desc: Install pinned Argo CD Operator and wait for Argo CD API readiness.
    vars:
      ARGOCD_NAME: e2e-argocd
    cmds:
      - kubectl apply --server-side -k github.com/argoproj-labs/argocd-operator/config/default?ref={{.ARGOCD_OPERATOR_VERSION}}
      - kubectl rollout status deployment/argocd-operator-controller-manager -n argocd-operator-system --timeout=5m
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"

        issuer="https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0"
        kubectl apply -n argocd -f - <<EOF
        apiVersion: argoproj.io/v1beta1
        kind: ArgoCD
        metadata:
          name: {{.ARGOCD_NAME}}
        spec:
          extraConfig:
            url: http://{{.ARGOCD_NAME}}-server
          oidcConfig: |
            name: Microsoft Entra ID
            issuer: ${issuer}
            clientID: ${ARGOCD_APP_CLIENT_ID}
            azure:
              useWorkloadIdentity: true
            requestedScopes:
              - openid
              - profile
              - email
            requestedIDTokenClaims:
              groups:
                essential: true
                value: ApplicationGroup
          server:
            annotations:
              azure.workload.identity/client-id: ${ARGOCD_APP_CLIENT_ID}
            env:
              - name: AZURE_CLIENT_ID
                value: ${ARGOCD_APP_CLIENT_ID}
              - name: AZURE_TENANT_ID
                value: ${AZURE_TENANT_ID}
              - name: AZURE_FEDERATED_TOKEN_FILE
                value: /var/run/secrets/azure/tokens/azure-identity-token
              - name: AZURE_AUTHORITY_HOST
                value: https://login.microsoftonline.com/
            insecure: true
            labels:
              azure.workload.identity/use: "true"
            volumeMounts:
              - mountPath: /var/run/secrets/azure/tokens
                name: azure-identity-token
                readOnly: true
            volumes:
              - name: azure-identity-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: api://AzureADTokenExchange
                        expirationSeconds: 3600
                        path: azure-identity-token
        EOF
      - |
        set -euo pipefail
        for resource in \
          serviceaccount/{{.ARGOCD_NAME}}-argocd-server \
          deployment/{{.ARGOCD_NAME}}-server \
          deployment/{{.ARGOCD_NAME}}-repo-server \
          statefulset/{{.ARGOCD_NAME}}-application-controller; do
          for attempt in $(seq 1 60); do
            if kubectl -n argocd get "$resource" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for $resource to be created" >&2
              exit 1
            fi
            sleep 5
          done
        done
        eval "$(task e2e:infra-output)"
        kubectl -n argocd annotate serviceaccount/{{.ARGOCD_NAME}}-argocd-server \
          azure.workload.identity/client-id="${ARGOCD_APP_CLIENT_ID}" \
          --overwrite
      - kubectl rollout status deployment/{{.ARGOCD_NAME}}-server -n argocd --timeout=10m
      - kubectl rollout status deployment/{{.ARGOCD_NAME}}-repo-server -n argocd --timeout=10m
      - kubectl rollout status statefulset/{{.ARGOCD_NAME}}-application-controller -n argocd --timeout=10m
      - |
        set -euo pipefail
        kubectl -n argocd patch configmap argocd-rbac-cm --type merge -p '{"data":{"scopes":"[groups]"}}'
        kubectl rollout restart deployment/{{.ARGOCD_NAME}}-server -n argocd
        kubectl rollout status deployment/{{.ARGOCD_NAME}}-server -n argocd --timeout=5m
      - |
        set -euo pipefail

        password="$(kubectl -n argocd get secret {{.ARGOCD_NAME}}-cluster -o jsonpath='{.data.admin\.password}' | base64 -d)"
        proxy_log="$(mktemp)"
        proxy_pid=""
        trap 'kill "$proxy_pid" 2>/dev/null || true; rm -f "$proxy_log"' EXIT

        argocd_api_port=""
        for candidate_port in $(seq 18080 18120); do
          : >"$proxy_log"
          kubectl proxy --port="${candidate_port}" >"$proxy_log" 2>&1 &
          proxy_pid="$!"

          for attempt in $(seq 1 30); do
            if grep -q 'Starting to serve on' "$proxy_log"; then
              argocd_api_port="$candidate_port"
              break 2
            fi
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ -z "$argocd_api_port" ]; then
            kill "$proxy_pid" 2>/dev/null || true
            proxy_pid=""
          fi
        done

        if [ -z "$argocd_api_port" ]; then
          echo "Timed out waiting for Kubernetes API proxy" >&2
          cat "$proxy_log" >&2
          exit 1
        fi

        argocd_api_url="http://127.0.0.1:${argocd_api_port}/api/v1/namespaces/argocd/services/http:{{.ARGOCD_NAME}}-server:80/proxy"

        for attempt in $(seq 1 60); do
          token="$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg username admin --arg password "$password" '{username: $username, password: $password}')" \
            "${argocd_api_url}/api/v1/session" 2>/dev/null | jq -r '.token // empty' || true)"
          if [ -n "$token" ]; then
            exit 0
          fi

          if [ "$attempt" -eq 60 ]; then
            echo "Timed out waiting for Argo CD API" >&2
            cat "$proxy_log" >&2
            exit 1
          fi
          sleep 5
        done

  e2e:build-image:
    desc: Build controller image as OCI tarball for e2e.
    cmds:
      - task: build-image
        vars:
          IMG: e2e.local/azure-k8s-role-assigner
          TAG: e2e
          IMG_TARBALL: e2e-image.tar

  e2e:load-image:
    desc: Load the ko-built tarball into the kind cluster.
    preconditions:
      - test -f e2e-image.tar
    cmds:
      - kind load image-archive e2e-image.tar --name {{.KIND_CLUSTER_NAME}}

  e2e:deploy:
    desc: Deploy controller with e2e configuration.
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"
        helm upgrade --install azure-k8s-role-assigner charts/azure-k8s-role-assigner \
          --namespace azure-k8s-role-assigner \
          --create-namespace \
          --set replicaCount=1 \
          --set image.repository=e2e.local/azure-k8s-role-assigner \
          --set image.tag=e2e \
          --set image.pullPolicy=IfNotPresent \
          --set-literal azure.servicePrincipals="${AZURE_SERVICE_PRINCIPALS}" \
          --set-string azure.tenantId="${AZURE_TENANT_ID}" \
          --set-string azure.clientId="${AZURE_CLIENT_ID}" \
          --set-string azure.appRoleId="${AZURE_APP_ROLE_ID}" \
          --set-string argocd.enabled=true \
          --set-string argocd.rbacConfigMap.namespace=argocd \
          --set-string argocd.rbacConfigMap.name=argocd-rbac-cm \
          --set-literal argocd.azure.servicePrincipals="${ARGOCD_AZURE_SERVICE_PRINCIPALS}" \
          --set-string argocd.azure.appRoleId="${ARGOCD_AZURE_APP_ROLE_ID}"
      - kubectl rollout status deployment/azure-k8s-role-assigner -n azure-k8s-role-assigner --timeout=5m

  e2e:create-rbac:
    desc: Create test RBAC bindings using Terraform-provisioned group IDs.
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"
        kubectl create namespace "{{.E2E_NS}}" --dry-run=client -o yaml | kubectl apply -f -
        kubectl create clusterrolebinding test-crb-binding \
          --clusterrole=cluster-admin \
          --group="${E2E_GROUP_CRB_ID}" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create rolebinding test-rb-binding \
          --namespace="{{.E2E_NS}}" \
          --clusterrole=view \
          --group="${E2E_GROUP_RB_ID}" \
          --dry-run=client -o yaml | kubectl apply -f -

  e2e:create-argocd-rbac:
    desc: Create Argo CD RBAC test data.
    vars:
      ARGOCD_NAME: e2e-argocd
      ARGOCD_PROJECT: e2e-argocd-groups
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"

        kubectl -n argocd patch configmap argocd-rbac-cm --type merge -p "$(jq -n \
          --arg group "${E2E_GROUP_ARGOCD_CONFIGMAP_ID}" \
          '{data: {"policy.csv": ("g, " + $group + ", role:admin\n"), scopes: "[groups]"}}')"

        kubectl apply -f - <<EOF
        apiVersion: argoproj.io/v1alpha1
        kind: AppProject
        metadata:
          name: {{.ARGOCD_PROJECT}}
          namespace: argocd
        spec:
          sourceRepos:
            - '*'
          destinations:
            - server: '*'
              namespace: '*'
          roles:
            - name: e2e
              groups:
                - ${E2E_GROUP_ARGOCD_APPPROJECT_ID}
              policies:
                - p, proj:{{.ARGOCD_PROJECT}}:e2e, applications, get, {{.ARGOCD_PROJECT}}/*, allow
        EOF
        kubectl -n argocd get appproject "{{.ARGOCD_PROJECT}}" -o yaml >/dev/null

  e2e:verify:
    desc: Verify bound groups appear in Entra token via ROPC user flow.
    preconditions:
      - sh: '[ -n "{{.E2E_TEST_USER_UPN}}" ]'
        msg: "E2E_TEST_USER_UPN must be set"
      - sh: '[ -n "{{.E2E_TEST_USER_PASSWORD}}" ] || [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]'
        msg: "E2E_TEST_USER_PASSWORD must be set, or run task e2e:download-user-password"
      - sh: '[ -n "{{.TEST_GROUP_CRB_ID}}" ]'
        msg: "TEST_GROUP_CRB_ID must be set"
      - sh: '[ -n "{{.TEST_GROUP_RB_ID}}" ]'
        msg: "TEST_GROUP_RB_ID must be set"
    vars:
      MAX_ATTEMPTS: '{{.MAX_ATTEMPTS | default "30"}}'
      SLEEP_SECONDS: '{{.SLEEP_SECONDS | default "10"}}'
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"

        E2E_PASSWORD="{{.E2E_TEST_USER_PASSWORD}}"
        if [ -z "$E2E_PASSWORD" ] && [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]; then
          E2E_PASSWORD="$(cat "{{.E2E_TEST_USER_PASSWORD_FILE}}")"
        fi

        if [ -z "$E2E_PASSWORD" ]; then
          echo "E2E test user password is empty"
          exit 1
        fi

        echo "Waiting for bound groups to appear in the Entra token..."
        for attempt in $(seq 1 {{.MAX_ATTEMPTS}}); do
          echo "Attempt ${attempt}/{{.MAX_ATTEMPTS}}"

          # Ensure each attempt is independent of prior kubelogin cache state.
          rm -rf "${HOME}/.kube/cache/kubelogin" "${HOME}/.kube/caches/kubelogin"

          TOKEN_JSON="$(kubelogin get-token \
            --login ropc \
            --server-id "${CLUSTER_APP_CLIENT_ID}" \
            --client-id "${CLUSTER_APP_CLIENT_ID}" \
            --tenant-id "${AZURE_TENANT_ID}" \
            --username "{{.E2E_TEST_USER_UPN}}" \
            --password "$E2E_PASSWORD" 2>&1)" || {
            echo "kubelogin get-token failed:"
            echo "$TOKEN_JSON"
            exit 1
          }

          ACCESS_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.status.token // .token // empty')"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Unable to extract access token from kubelogin output:"
            echo "$TOKEN_JSON"
            exit 1
          fi

          JWT_PAYLOAD_B64="$(printf '%s' "$ACCESS_TOKEN" | cut -d '.' -f2 | tr '_-' '/+')"
          PADDED_PAYLOAD_B64="$(printf '%s' "$JWT_PAYLOAD_B64" | awk '{m=length($0)%4; if (m==2) printf "%s==",$0; else if (m==3) printf "%s=",$0; else if (m==1) printf "%s===",$0; else printf "%s",$0}')"
          JWT_PAYLOAD="$(printf '%s' "$PADDED_PAYLOAD_B64" | openssl base64 -d -A 2>/dev/null || true)"

          if [ -z "$JWT_PAYLOAD" ]; then
            echo "Failed to decode JWT payload from access token"
            exit 1
          fi

          GROUPS="$(echo "$JWT_PAYLOAD" | jq -r '.groups // [] | .[]')"

          echo ""
          echo "Groups in token:"
          echo "$GROUPS"
          echo ""

          PASS=true
          for gid in "{{.TEST_GROUP_CRB_ID}}" "{{.TEST_GROUP_RB_ID}}"; do
            if echo "$GROUPS" | grep -q "$gid"; then
              echo "PASS: Bound group $gid is present in token"
            else
              echo "MISS: Bound group $gid is not in token yet"
              PASS=false
            fi
          done

          if [ "$PASS" = true ]; then
            echo ""
            echo "All group verification checks passed!"
            exit 0
          fi

          kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner --tail=10 || true
          if [[ "$attempt" -eq {{.MAX_ATTEMPTS}} ]]; then
            echo "Timed out waiting for bound groups in token."
            exit 1
          fi
          sleep {{.SLEEP_SECONDS}}
        done

  e2e:verify-deletion:
    desc: Verify that deleting a binding removes its group from the Entra token.
    preconditions:
      - sh: '[ -n "{{.E2E_TEST_USER_UPN}}" ]'
        msg: "E2E_TEST_USER_UPN must be set"
      - sh: '[ -n "{{.E2E_TEST_USER_PASSWORD}}" ] || [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]'
        msg: "E2E_TEST_USER_PASSWORD must be set, or run task e2e:download-user-password"
      - sh: '[ -n "{{.TEST_GROUP_CRB_ID}}" ]'
        msg: "TEST_GROUP_CRB_ID must be set"
      - sh: '[ -n "{{.TEST_GROUP_RB_ID}}" ]'
        msg: "TEST_GROUP_RB_ID must be set"
    vars:
      MAX_ATTEMPTS: '{{.MAX_ATTEMPTS | default "30"}}'
      SLEEP_SECONDS: '{{.SLEEP_SECONDS | default "10"}}'
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"

        E2E_PASSWORD="{{.E2E_TEST_USER_PASSWORD}}"
        if [ -z "$E2E_PASSWORD" ] && [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]; then
          E2E_PASSWORD="$(cat "{{.E2E_TEST_USER_PASSWORD_FILE}}")"
        fi

        if [ -z "$E2E_PASSWORD" ]; then
          echo "E2E test user password is empty"
          exit 1
        fi

        # Delete only the RoleBinding, leaving the ClusterRoleBinding in place.
        # After reconciliation, the RoleBinding's group must disappear from the
        # token while the ClusterRoleBinding's group must remain. Asserting both
        # conditions proves the controller de-assigned the specific group rather
        # than the token simply dropping all groups.
        echo "Deleting RoleBinding test-rb-binding (group ${TEST_GROUP_RB_ID})..."
        kubectl delete rolebinding test-rb-binding -n "{{.E2E_NS}}" --ignore-not-found

        echo "Waiting for the deleted binding's group to leave the Entra token..."
        for attempt in $(seq 1 {{.MAX_ATTEMPTS}}); do
          echo "Attempt ${attempt}/{{.MAX_ATTEMPTS}}"

          # Ensure each attempt fetches a fresh token, independent of cache.
          rm -rf "${HOME}/.kube/cache/kubelogin" "${HOME}/.kube/caches/kubelogin"

          TOKEN_JSON="$(kubelogin get-token \
            --login ropc \
            --server-id "${CLUSTER_APP_CLIENT_ID}" \
            --client-id "${CLUSTER_APP_CLIENT_ID}" \
            --tenant-id "${AZURE_TENANT_ID}" \
            --username "{{.E2E_TEST_USER_UPN}}" \
            --password "$E2E_PASSWORD" 2>&1)" || {
            echo "kubelogin get-token failed:"
            echo "$TOKEN_JSON"
            exit 1
          }

          ACCESS_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.status.token // .token // empty')"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Unable to extract access token from kubelogin output:"
            echo "$TOKEN_JSON"
            exit 1
          fi

          JWT_PAYLOAD_B64="$(printf '%s' "$ACCESS_TOKEN" | cut -d '.' -f2 | tr '_-' '/+')"
          PADDED_PAYLOAD_B64="$(printf '%s' "$JWT_PAYLOAD_B64" | awk '{m=length($0)%4; if (m==2) printf "%s==",$0; else if (m==3) printf "%s=",$0; else if (m==1) printf "%s===",$0; else printf "%s",$0}')"
          JWT_PAYLOAD="$(printf '%s' "$PADDED_PAYLOAD_B64" | openssl base64 -d -A 2>/dev/null || true)"

          if [ -z "$JWT_PAYLOAD" ]; then
            echo "Failed to decode JWT payload from access token"
            exit 1
          fi

          GROUPS="$(echo "$JWT_PAYLOAD" | jq -r '.groups // [] | .[]')"

          echo ""
          echo "Groups in token:"
          echo "$GROUPS"
          echo ""

          RB_ABSENT=true
          if echo "$GROUPS" | grep -q "{{.TEST_GROUP_RB_ID}}"; then
            RB_ABSENT=false
          fi

          CRB_PRESENT=false
          if echo "$GROUPS" | grep -q "{{.TEST_GROUP_CRB_ID}}"; then
            CRB_PRESENT=true
          fi

          if [ "$RB_ABSENT" = true ] && [ "$CRB_PRESENT" = true ]; then
            echo "PASS: Deleted RoleBinding group {{.TEST_GROUP_RB_ID}} is gone from the token"
            echo "PASS: ClusterRoleBinding group {{.TEST_GROUP_CRB_ID}} is still present"
            echo ""
            echo "Deletion verification passed!"
            exit 0
          fi

          if [ "$RB_ABSENT" != true ]; then
            echo "WAIT: Deleted group {{.TEST_GROUP_RB_ID}} is still present in token"
          fi
          if [ "$CRB_PRESENT" != true ]; then
            # This should not happen; the CRB was not deleted. Surface loudly.
            echo "ERROR: Still-bound group {{.TEST_GROUP_CRB_ID}} unexpectedly missing from token"
          fi

          kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner --tail=10 || true
          if [[ "$attempt" -eq {{.MAX_ATTEMPTS}} ]]; then
            echo "Timed out waiting for the deleted binding's group to leave the token."
            exit 1
          fi
          sleep {{.SLEEP_SECONDS}}
        done

  e2e:verify-argocd:
    desc: Verify Argo CD RBAC groups appear in the Argo CD Entra token.
    preconditions:
      - sh: '[ -n "{{.E2E_TEST_USER_UPN}}" ]'
        msg: "E2E_TEST_USER_UPN must be set"
      - sh: '[ -n "{{.E2E_TEST_USER_PASSWORD}}" ] || [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]'
        msg: "E2E_TEST_USER_PASSWORD must be set, or run task e2e:download-user-password"
      - sh: '[ -n "{{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}}" ]'
        msg: "TEST_GROUP_ARGOCD_CONFIGMAP_ID must be set"
      - sh: '[ -n "{{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}" ]'
        msg: "TEST_GROUP_ARGOCD_APPPROJECT_ID must be set"
    vars:
      MAX_ATTEMPTS: '{{.MAX_ATTEMPTS | default "30"}}'
      SLEEP_SECONDS: '{{.SLEEP_SECONDS | default "10"}}'
      ARGOCD_NAME: e2e-argocd
    cmds:
      - |
        set -euo pipefail
        eval "$(task e2e:infra-output)"

        E2E_PASSWORD="{{.E2E_TEST_USER_PASSWORD}}"
        if [ -z "$E2E_PASSWORD" ] && [ -f "{{.E2E_TEST_USER_PASSWORD_FILE}}" ]; then
          E2E_PASSWORD="$(cat "{{.E2E_TEST_USER_PASSWORD_FILE}}")"
        fi

        if [ -z "$E2E_PASSWORD" ]; then
          echo "E2E test user password is empty"
          exit 1
        fi

        echo "Waiting for Argo CD RBAC groups to appear in the Argo CD Entra token..."
        port_forward_log="$(mktemp)"
        port_forward_pid=""
        trap 'kill "$port_forward_pid" 2>/dev/null || true; rm -f "$port_forward_log"' EXIT

        argocd_api_port=""
        for candidate_port in $(seq 18080 18120); do
          : >"$port_forward_log"
          kubectl -n argocd port-forward "service/{{.ARGOCD_NAME}}-server" "${candidate_port}:80" >"$port_forward_log" 2>&1 &
          port_forward_pid="$!"

          for attempt in $(seq 1 30); do
            if grep -q 'Forwarding from' "$port_forward_log"; then
              argocd_api_port="$candidate_port"
              break 2
            fi
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ -z "$argocd_api_port" ]; then
            kill "$port_forward_pid" 2>/dev/null || true
            port_forward_pid=""
          fi
        done

        if [ -z "$argocd_api_port" ]; then
          echo "Timed out waiting for Argo CD API port-forward" >&2
          cat "$port_forward_log" >&2
          exit 1
        fi

        argocd_api_url="http://127.0.0.1:${argocd_api_port}"

        for attempt in $(seq 1 {{.MAX_ATTEMPTS}}); do
          echo "Attempt ${attempt}/{{.MAX_ATTEMPTS}}"

          TOKEN_JSON="$(curl -fsS \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${ARGOCD_APP_CLIENT_ID}" \
            --data-urlencode 'grant_type=password' \
            --data-urlencode 'scope=openid profile email' \
            --data-urlencode "username={{.E2E_TEST_USER_UPN}}" \
            --data-urlencode "password=${E2E_PASSWORD}" \
            "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" 2>&1)" || {
            echo "Entra ROPC token request failed:"
            echo "$TOKEN_JSON"
            exit 1
          }

          ID_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.id_token // empty')"

          if [ -z "$ID_TOKEN" ]; then
            echo "Unable to extract ID token from Entra response:"
            echo "$TOKEN_JSON"
            exit 1
          fi

          ID_TOKEN_PAYLOAD_B64="$(printf '%s' "$ID_TOKEN" | cut -d '.' -f2 | tr '_-' '/+')"
          PADDED_ID_TOKEN_PAYLOAD_B64="$(printf '%s' "$ID_TOKEN_PAYLOAD_B64" | awk '{m=length($0)%4; if (m==2) printf "%s==",$0; else if (m==3) printf "%s=",$0; else if (m==1) printf "%s===",$0; else printf "%s",$0}')"
          ID_TOKEN_PAYLOAD="$(printf '%s' "$PADDED_ID_TOKEN_PAYLOAD_B64" | openssl base64 -d -A 2>/dev/null || true)"

          if [ -z "$ID_TOKEN_PAYLOAD" ]; then
            echo "Failed to decode JWT payload from Argo CD ID token"
            exit 1
          fi

          echo ""
          echo "Argo CD ID token claims:"
          echo "$ID_TOKEN_PAYLOAD" | jq '{iss, aud, sub, email, preferred_username, groups: (.groups // [])}'

          USERINFO="$(curl -fsS \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${argocd_api_url}/api/v1/session/userinfo" 2>&1 || true)"

          if ! echo "$USERINFO" | jq . >/dev/null 2>&1; then
            echo "WAIT: Argo CD userinfo request did not return JSON yet:"
            echo "$USERINFO"
            kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner --tail=10 || true
            if [[ "$attempt" -eq {{.MAX_ATTEMPTS}} ]]; then
              echo "Timed out waiting for Argo CD userinfo JSON."
              cat "$port_forward_log" >&2
              exit 1
            fi
            sleep {{.SLEEP_SECONDS}}
            continue
          fi

          GROUPS="$(echo "$USERINFO" | jq -r '.groups // [] | .[]')"
          GROUP_COUNT="$(echo "$USERINFO" | jq -r '.groups // [] | length')"

          echo ""
          echo "Argo CD userinfo response:"
          echo "$USERINFO" | jq .
          echo ""

          configmap_group_present=false
          appproject_group_present=false
          if echo "$GROUPS" | grep -qx "{{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}}"; then
            configmap_group_present=true
          fi
          if echo "$GROUPS" | grep -qx "{{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}"; then
            appproject_group_present=true
          fi

          if [ "$GROUP_COUNT" -eq 2 ] && [ "$configmap_group_present" = true ] && [ "$appproject_group_present" = true ]; then
            echo "PASS: Argo CD userinfo returned only ConfigMap group {{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}} and AppProject group {{.TEST_GROUP_ARGOCD_APPPROJECT_ID}}"
            exit 0
          fi

          echo "WAIT: Argo CD userinfo did not return exactly the assigned Argo CD groups yet"
          if [ "$configmap_group_present" != true ]; then
            echo "MISS: ConfigMap group {{.TEST_GROUP_ARGOCD_CONFIGMAP_ID}} is not in userinfo yet"
          fi
          if [ "$appproject_group_present" != true ]; then
            echo "MISS: AppProject group {{.TEST_GROUP_ARGOCD_APPPROJECT_ID}} is not in userinfo yet"
          fi
          if [ "$GROUP_COUNT" -ne 2 ]; then
            echo "WAIT: Expected exactly 2 Argo CD groups, got ${GROUP_COUNT}"
          fi
          kubectl logs -n azure-k8s-role-assigner deployment/azure-k8s-role-assigner --tail=10 || true
          if [[ "$attempt" -eq {{.MAX_ATTEMPTS}} ]]; then
            echo "Timed out waiting for exact Argo CD ConfigMap/AppProject group set from userinfo."
            kubectl logs -n argocd deployment/{{.ARGOCD_NAME}}-server --tail=100 || true
            cat "$port_forward_log" >&2
            exit 1
          fi
          sleep {{.SLEEP_SECONDS}}
        done

  e2e:cleanup:
    desc: Clean up e2e Kubernetes resources.
    cmds:
      - kubectl delete clusterrolebinding test-crb-binding --ignore-not-found
      - kubectl delete rolebinding test-rb-binding -n {{.E2E_NS}} --ignore-not-found
      - kubectl delete namespace {{.E2E_NS}} --ignore-not-found
      - helm uninstall azure-k8s-role-assigner --namespace azure-k8s-role-assigner --ignore-not-found
      - kubectl delete argocd e2e-argocd -n argocd --ignore-not-found --timeout=5m
      - kubectl delete namespace argocd --ignore-not-found --timeout=5m
      - kubectl delete -k github.com/argoproj-labs/argocd-operator/config/default?ref={{.ARGOCD_OPERATOR_VERSION}} --ignore-not-found

  e2e:cluster-down:
    desc: Delete the kind e2e cluster.
    cmds:
      - task: kind:delete-internal
        vars:
          KIND_CLUSTER_NAME: "{{.KIND_CLUSTER_NAME}}"

  changelog:
    desc: Generate changelog using git-cliff.
    cmds:
      - git-cliff --config .cliff.yml --output CHANGELOG.md

  next-version:
    desc: Print the next semantic version based on conventional commits.
    cmds:
      - git-cliff --config .cliff.yml --bumped-version

  release:pr:
    desc: Create an empty release-candidate PR for the next git-cliff version.
    vars:
      BASE_BRANCH: '{{.BASE_BRANCH | default "main"}}'
      RELEASE_BRANCH: '{{.RELEASE_BRANCH | default ""}}'
    cmds:
      - |
        set -euo pipefail

        for cmd in git gh git-cliff; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            echo "Missing required command: $cmd" >&2
            exit 1
          fi
        done

        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Working tree is dirty. Commit, stash, or discard changes before creating a release PR." >&2
          exit 1
        fi

        BASE_BRANCH="{{.BASE_BRANCH}}"
        NEXT_VERSION="$(git-cliff --config .cliff.yml --bumped-version)"
        RELEASE_BRANCH="{{.RELEASE_BRANCH}}"
        if [ -z "$RELEASE_BRANCH" ]; then
          RELEASE_BRANCH="release/${NEXT_VERSION}"
        fi

        git fetch origin "$BASE_BRANCH"
        git switch "$BASE_BRANCH"
        git pull --ff-only origin "$BASE_BRANCH"
        git switch -c "$RELEASE_BRANCH"
        git commit --allow-empty -m "chore: release ${NEXT_VERSION}"
        git push -u origin "$RELEASE_BRANCH"

        PR_URL="$(gh pr create \
          --base "$BASE_BRANCH" \
          --head "$RELEASE_BRANCH" \
          --title "chore: release ${NEXT_VERSION}" \
          --body "Release candidate for ${NEXT_VERSION}. Merge this PR after the release preview and CI pass.")"
        if ! gh label list --json name --jq '.[].name' | grep -qx release-candidate; then
          gh label create release-candidate \
            --description "Marks PRs that should trigger release preview and publish workflows" \
            --color 5319e7
        fi
        gh pr edit "$PR_URL" --add-label release-candidate
        echo "$PR_URL"
