# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: azure-k8s-role-assigner

snapshot:
  version_template: "{{ if .Env.GORELEASER_SNAPSHOT_VERSION }}{{ .Env.GORELEASER_SNAPSHOT_VERSION }}-SNAPSHOT-{{ .ShortCommit }}{{ else }}{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}{{ end }}"

builds:
  - id: manager
    main: ./cmd/main.go
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

kos:
  - id: manager
    main: ./cmd
    # Must match .ko.yaml. GoReleaser does not read .ko.yaml, so without this
    # the release image silently falls back to ko's default base image
    # (cgr.dev/chainguard/static) while the OCI label below claims hi/static.
    base_image: registry.access.redhat.com/hi/static@sha256:c51e17de4a96e3bd68361830ec54f3c43ffcf398b82765a1ce250bd4a0d99d1f
    repositories:
      - ghcr.io/dronenb/azure-k8s-role-assigner
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{.Version}}"
      - latest
    bare: true
    preserve_import_paths: false
    sbom: spdx
    sbom_directory: dist/sbom
    creation_time: "{{.CommitTimestamp}}"
    labels:
      org.opencontainers.image.title: azure-k8s-role-assigner
      org.opencontainers.image.description: Kubernetes controller that syncs RBAC bindings to Azure Entra ID app role assignments
      org.opencontainers.image.url: https://github.com/dronenb/azure-k8s-role-assigner
      org.opencontainers.image.documentation: https://github.com/dronenb/azure-k8s-role-assigner
      org.opencontainers.image.source: https://github.com/dronenb/azure-k8s-role-assigner
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.authors: dronenb
      org.opencontainers.image.vendor: dronenb
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.base.name: registry.access.redhat.com/hi/static

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

docker_signs:
  # Explicit args are required: GoReleaser's default is key-based
  # ("--key=cosign.key"), but releases sign keylessly via GitHub OIDC.
  - artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

docker_digest:
  name_template: "{{ .ProjectName }}_digests.txt"

archives:
  - formats:
      - binary

changelog:
  disable: true
